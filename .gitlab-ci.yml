stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f Dockerfile.backend -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
  only:
    - main
    - merge_requests

build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f Dockerfile.frontend -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG
  only:
    - main
    - merge_requests

test:
  stage: test
  image: python:3.12-slim
  script:
    - apt-get update && apt-get install -y build-essential
    - pip install -r requirements.txt
    - flake8 src/backend/ src/frontend/ --max-line-length=100 --extend-ignore=E203,W503
    - black --check src/backend/ src/frontend/
    - pytest tests/ --tb=short
  only:
    - main
    - merge_requests

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - sed -i "s|\${BACKEND_IMAGE}|$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG|g" k8s/backend.yaml
    - sed -i "s|\${FRONTEND_IMAGE}|$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG|g" k8s/frontend.yaml
    - kubectl apply -f k8s/backend.yaml
    - kubectl apply -f k8s/frontend.yaml
  only:
    - main
  when: manual
