version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fake_news_backend
    ports:
      - "8000:8000"
    environment:
      - BERTOPIC_MODEL_PATH=/app/bert_fake_true
      - LOGREG_MODEL_PATH=/app/log_reg_fake_true
    volumes:
      - ./bert_fake_true:/app/bert_fake_true:ro
      - ./log_reg_fake_true:/app/log_reg_fake_true:ro
      - ./topic_mapping.json:/app/topic_mapping.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fake_news_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped